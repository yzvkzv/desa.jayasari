<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Desa Jayasari</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 80px;">
    <div class="card">
      <h2>Login Admin Desa</h2>
      <label>Email Admin:</label>
      <input type="email" id="email" placeholder="admin@jayasari.desa.id">
      <label>Password:</label>
      <input type="password" id="password" placeholder="********">
      <button type="button" class="btn" onclick="loginAdmin()">Masuk Dashboard</button>
      <br><br>
      <a href="index.html" style="color: var(--primary); text-decoration: none; display: block; text-align: center;">&larr; Kembali ke Beranda</a>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
